name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest patch of the go.mod minor version: a fixed 1.26.0 would
          # build releases without later standard-library security fixes.
          go-version: "1.26.x"
          check-latest: true
      - name: Install mingw-w64 and the Elgato CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          npm install -g @elgato/cli
      - run: bash scripts/check.sh
